# Publishing a GitHub release builds that tag and attaches MetalStream-<tag>.zip,
# MetalStream-<tag>-debug-symbols.zip and SHA256SUMS to it. Run it by hand to rebuild an existing release.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag of an existing release to rebuild and re-upload
        required: true

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      ref: refs/tags/${{ github.event.release.tag_name || inputs.tag }}
      version: ${{ github.event.release.tag_name || inputs.tag }}

  upload:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Attach files to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: gh release upload "${TAG}" dist/* --clobber --repo "${GITHUB_REPOSITORY}"
