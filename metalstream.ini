; MetalStream settings. Defaults and valid ranges: README.md (Configuration) / src/common/config.cpp.
; Invalid values are corrected and reported in metalstream.log.
[MetalStream]
; Set EnableLogging=1 to enable logging (default is 0)
EnableLogging=0
; Set Debug=1 to include verbose per-frame debug logs (default is 0)
Debug=0
; Frame generation (DLSS-G): 0 = force off, 1 = follow the game setting (default)
FrameGeneration=1
; 1 = show only generated frames (to judge interpolation quality), 0 = normal (default)
FGDebugView=0
; Without vsync: 1 = present from a dedicated thread, real frame half a game frame after the
; generated one (default); 0 = present both frames back-to-back
FGPacing=1
; Game frame cap while generating without vsync: 0 = no cap, the game's own setting applies
; (default); -1 = half the display refresh rate; N = N fps (clamped to -1..1000)
FGMaxGameFps=0
; 1 = pass the game camera vectors/matrix to the interpolator (default), 0 = omit them
FGCameraData=1
; 1 = F10 saves 3 consecutive frames to metalstream_capture\ for analysis, 2 = also one automatic
; burst after 120 frames (for tests), 0 = off (default)
FGCapture=0
